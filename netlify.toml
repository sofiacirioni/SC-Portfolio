# Netlify build & deploy config for the Angular app.
# Netlify reads this automatically — no need to type build settings in the UI.

[build]
  command = "npm run build"
  publish = "dist/portfolio/browser"

# Single-page app: serve index.html for any path (200, not a redirect).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Basic security headers for all responses.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
