<div class="min-h-screen px-[1rem]">
  <app-nav />

  <main class="mt-0">
    <div class="hero-scene">
      <app-hero />

      <section class="phrase-section" aria-label="Inspire through design">
        @for (line of phraseLines; track $index) {
          <p class="phrase">
            @for (letter of line.letters; track $index) {
              @if (letter.char === ' ') {
                <span class="phrase-space"></span>
              } @else {
                <span
                  class="phrase-letter"
                  [class.phrase-letter--mono]="letter.font === 'mono'"
                  [class.phrase-letter--serif]="letter.font === 'serif'"
                  [style.animation-delay]="letter.delay + 'ms'"
                >{{ letter.char }}</span>
              }
            }
          </p>
        }
      </section>
    </div>
  </main>
</div>
