<div class="page-wrapper global-grid">
  <header class="grid-full">
    <app-nav />
  </header>

  <main class="grid-full">
    <div class="hero-scene">
      <app-hero />

      <div class="hero-lower">
        <section class="phrase-section" aria-label="Inspire through design">
          <app-scramble-phrase
            [lines]="phraseLines"
            [baseDelayS]="4"
            fontSize="6rem"
            (complete)="onPhraseComplete()"
          />
        </section>

        <div class="hero-cta" [class.phrase-ready]="phraseReady">
          <app-pill-btn label="See projects" href="#projects" />
        </div>
      </div>

      <div class="scroll-hint" [class.phrase-ready]="phraseReady" aria-hidden="true">
        <span class="scroll-hint__circle">
          <svg class="scroll-hint__arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <polyline points="19 12 12 19 5 12"/>
          </svg>
        </span>
        <span class="scroll-hint__label">Scroll</span>
      </div>
    </div>

    <!--
      Full-width tickers (4 rows, 100vw).
      Positioned absolutely to cross the Hero bottom / About top boundary.
      z-index: 20 — sit on top of both sections.
    -->
    <div class="boundary-tickers" aria-hidden="true">
      <app-ticker-tape [rows]="fullTickerRows" />
    </div>

    <app-about />

    <!--
      Projects intro — intro phrases + ASCII animation TBD.
      id="projects" anchors the "See projects" hero button.
    -->
    <section class="projects-intro global-grid" id="projects">
      <div class="projects-phrases">
        <p class="projects-phrase">BUILDING TANGIBLE SOLUTIONS</p>
        <p class="projects-phrase">CREATING MEANINGFUL PATHS</p>
        <p class="projects-phrase">DOING EXPERIENCES MEMORABLES</p>
      </div>

      <!-- ASCII animation / visual element goes here -->
      <div class="projects-ascii-placeholder" aria-hidden="true"></div>
    </section>

    <!-- Projects accordion — 4 expandable cards -->
    <app-projects />
  </main>
</div>
