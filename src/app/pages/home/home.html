<div class="page-wrapper">
  <header class="grid-full">
    <app-nav />
  </header>

  <main class="grid-full">
    <div class="hero-scene">
      <app-hero />

      <!--
        hero-lower sits in normal flow right below the animation.
        It uses flex to put the phrase on the left and the button on the right.
        A negative margin-top pulls both 3rem up into the animation.
        The button's padding-top compensates, visually placing it
        at the animation's natural bottom edge.
      -->
      <div class="hero-lower">
        <section class="phrase-section" aria-label="Inspire through design">
          <app-scramble-phrase
            [lines]="phraseLines"
            [baseDelayS]="4"
            fontSize="6rem"
            (complete)="onPhraseComplete()"
          />
        </section>

        <div class="hero-cta" [class.phrase-ready]="phraseReady">
          <app-pill-btn label="See projects" href="#projects" />
        </div>
      </div>

      <div class="scroll-hint" [class.phrase-ready]="phraseReady" aria-hidden="true">
        <span class="scroll-hint__circle">
          <svg class="scroll-hint__arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <polyline points="19 12 12 19 5 12"/>
          </svg>
        </span>
        <span class="scroll-hint__label">Scroll</span>
      </div>
    </div>

    <app-ticker-tape [rows]="tickerRows" />
  </main>
</div>
