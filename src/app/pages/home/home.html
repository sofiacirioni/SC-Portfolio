<div id="top" class="page-wrapper global-grid">
  <header class="grid-full site-header">
    <app-nav />
  </header>

  <!--
    Fixed ASCII backdrop — the ONLY anchored element. It stays pinned near the
    top of the viewport while the whole content layer scrolls over/through it.
    Softened (opacity + cloud tone) so any text passing over it stays legible.
    aria-hidden + pointer-events:none → never intercepts scroll or clicks.
  -->
  <div class="hero-backdrop" #heroBackdrop aria-hidden="true">
    <app-hero />
  </div>

  <main class="grid-full content-layer">
    <div class="hero-scene">
      <div class="hero-lower">
        <section
          class="phrase-section"
          [attr.aria-label]="i18n.lang() === 'es' ? 'La cabeza en las nubes, las manos en el código' : 'Head in the clouds, hands in the code'"
        >
          <!-- Re-keyed by language so the scramble re-inits with the new words -->
          @for (lc of [i18n.lang()]; track lc) {
            <app-scramble-phrase
              [lines]="phraseLines()"
              [baseDelayS]="phraseReady ? 0 : 4"
              fontSize="clamp(2.25rem, 6.5vw, 4.5rem)"
              (complete)="onPhraseComplete()"
            />
          }
          <p class="hero-subline" [class.phrase-ready]="phraseReady">
            {{ copy().subline }}
          </p>
        </section>

        <div class="hero-cta" [class.phrase-ready]="phraseReady">
          <app-pill-btn [label]="copy().cta" href="#projects" />
        </div>
      </div>

      <div class="scroll-hint" [class.phrase-ready]="phraseReady" aria-hidden="true">
        <app-arrow-icon class="scroll-hint__arrow" />
        <span class="scroll-hint__label">{{ copy().scroll }}</span>
      </div>
    </div>

    <!--
      Full-width tickers (4 rows, 100vw).
      Positioned absolutely to cross the Hero bottom / About top boundary.
      z-index: 20 — sit on top of both sections.
    -->
    <div class="boundary-tickers" aria-hidden="true">
      <app-ticker-tape [rows]="fullTickerRows" />
    </div>

    <app-about />

    <!--
      Projects intro — editorial lead-in line, revealed with a clip-path mask.
      id="projects" anchors the "See projects" hero button.
    -->
    <section class="projects-intro" id="projects">
      <span class="projects-intro-label">{{ copy().introLabel }}</span>
      <p class="projects-intro-line">
        <span class="projects-intro-mask" #introMask>{{ copy().introLine1 }}</span>
        <span class="projects-intro-mask" #introMask><em>{{ copy().introLine2 }}</em></span>
      </p>
    </section>

    <!-- Projects accordion — 4 expandable cards -->
    <app-projects />

    <!-- Contact section — alternating scramble phrases + ASCII placeholder -->
    <app-contact />

    <!-- Footer — social, tagline, credits, ASCII placeholder -->
    <app-site-footer #footerAnchor />
  </main>
</div>
