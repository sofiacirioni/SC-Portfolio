<section class="contact-section global-grid" id="contact" #sectionEl>

  <!-- Section label -->
  <span class="contact-label">{{ copy().label }}</span>

  <!-- Phrase + CTA — left 5 columns -->
  <div class="contact-phrase-area">

    <div class="contact-phrase-wrapper" [class.is-exiting]="phraseExiting()">
      @if (phraseVisible()) {
        <!-- Re-keyed by language so a toggle re-scrambles in the new language -->
        @for (lc of [i18n.lang()]; track lc) {
          <app-scramble-phrase
            [lines]="currentLines"
            [baseDelayS]="0"
            fontSize="clamp(2.5rem, 11vw, 4.5rem)"
            [idleMinMs]="15000"
            [idleMaxMs]="25000"
            (complete)="onPhraseComplete()"
          />
        }
      }
    </div>

    <app-pill-btn [label]="copy().cta" href="mailto:sofiacirioni07@gmail.com" />

  </div>

  <!-- ASCII animation — right columns, accent blue -->
  <div class="contact-ascii" aria-hidden="true">
    <app-ascii-video src="assets/video/contact-animation.mp4" [cols]="130" [rows]="60" [fps]="14" />
  </div>

</section>
