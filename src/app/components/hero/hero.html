<section #heroSection>
  <pre #animPre></pre>

  <!-- Hidden sources: the ASCII engine samples these frame-by-frame onto a canvas.
       Intro "hello" plays once, then the clouds loop takes over. -->
  <video
    #helloVideo
    class="cloud-source"
    src="assets/video/hello-animation.mp4"
    muted
    autoplay
    playsinline
    preload="auto"
    aria-hidden="true"
  ></video>
  <video
    #cloudVideo
    class="cloud-source"
    src="assets/video/nubes-loop.mp4"
    muted
    loop
    playsinline
    preload="auto"
    aria-hidden="true"
  ></video>
</section>
