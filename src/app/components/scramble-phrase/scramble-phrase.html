<div #phraseContainer>
  @for (line of phraseLines; track $index) {
    <p class="phrase" [style.font-size]="fontSize">
      @for (token of line.tokens; track $index) {
        @if (token.isSpace) {
          <span class="phrase-space"></span>
        } @else {
          <span
            class="phrase-letter"
            [attr.data-char]="token.char"
            [attr.data-font]="token.font"
          >{{ token.char }}</span>
        }
      }
    </p>
  }
</div>
