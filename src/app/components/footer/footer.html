<footer class="site-footer" #sectionEl>
  <div class="footer-inner global-grid">

    <!-- ── Social links (text, not buttons) ───────── -->
    <nav class="footer-social" aria-label="Social links">
      <span class="footer-label">{{ copy().social }}</span>
      <ul class="footer-links">
        <li>
          <a href="mailto:sofiacirioni07@gmail.com">
            <span class="footer-link-text">Email</span><app-arrow-icon [angle]="-135" />
          </a>
        </li>
        <li>
          <a href="https://linkedin.com/in/sofiacirioni" target="_blank" rel="noopener noreferrer">
            <span class="footer-link-text">LinkedIn</span><app-arrow-icon [angle]="-135" />
          </a>
        </li>
        <li>
          <a href="https://github.com/sofiacirioni" target="_blank" rel="noopener noreferrer">
            <span class="footer-link-text">GitHub</span><app-arrow-icon [angle]="-135" />
          </a>
        </li>
        <li>
          <a href="https://behance.net/sofiacirioni" target="_blank" rel="noopener noreferrer">
            <span class="footer-link-text">Behance</span><app-arrow-icon [angle]="-135" />
          </a>
        </li>
      </ul>
    </nav>

    <!-- ── Closing note + back to top (right) ──────── -->
    <div class="footer-meta">
      <p class="footer-note" [innerHTML]="copy().note"></p>
      <a class="footer-top" href="#top">{{ copy().top }}<span class="footer-link-arrow">↑</span></a>
    </div>

    <!-- ── Name (IBM Plex Serif bold) with gravity letters ──────── -->
    <app-gravity-word class="footer-wordmark" text="Sofía Cirioni" />

    <!-- ── Legal line ──────────────────────────────── -->
    <div class="footer-legal">
      <span>© 2026 Sofía Cirioni</span>
      <span>{{ copy().rights }}</span>
      <span class="footer-made">{{ copy().made }} <img class="footer-sun" src="assets/images/arg-sun.png" alt="" aria-hidden="true" /></span>
    </div>

  </div>
</footer>
